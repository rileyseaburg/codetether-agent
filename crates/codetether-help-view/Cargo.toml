[package]
name = "codetether-help-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Help reference content, scrolling and terminal overlay rendering"

[dependencies]
codetether-token-display = { path = "../codetether-token-display", version = "0.1.0" }
codetether-theme = { path = "../codetether-theme", version = "0.1.0", features = ["ratatui"] }
codetether-telemetry = { path = "../codetether-telemetry", version = "0.1.0" }
codetether-terminal-clipboard = { path = "../codetether-terminal-clipboard", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false }
