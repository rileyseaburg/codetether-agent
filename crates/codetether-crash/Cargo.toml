[package]
name = "codetether-crash"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Crash capture, spool persistence, and deferred uploads for CodeTether"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-telemetry = { path = "../codetether-telemetry", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
