[package]
name = "codetether-k8s"
version = "0.1.0"
edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "Kubernetes self-deployment and lease coordination for CodeTether"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
codetether-tls = { path = "../codetether-tls", version = "0.1.0" }
gethostname = "1"
hex = "0.4"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["runtime", "client", "derive", "config", "rustls-tls", "aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
http = "1.5.0"
tower = "0.5"
