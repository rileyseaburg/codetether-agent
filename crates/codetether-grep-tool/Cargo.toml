[package]
name = "codetether-grep-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded literal and regex grep tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
glob = "0.3.4"
ignore = "0.4.33"
regex = "1.13.1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
