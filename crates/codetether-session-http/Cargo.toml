[package]
name = "codetether-session-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Persisted-session HTTP handlers and native storage contract"

[dependencies]
codetether-session-fork = { path = "../codetether-session-fork", version = "0.1.0" }
uuid = { version = "1", features = ["v4"] }
codetether-goal-core = { path = "../codetether-goal-core", version = "0.1.0" }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-session-metadata = { path = "../codetether-session-metadata", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
codetether-authorization-policy = { path = "../codetether-authorization-policy", version = "0.1.0" }
