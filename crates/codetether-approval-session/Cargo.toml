[package]
name = "codetether-approval-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Live approval delivery through session event channels"
license = "MIT"

[dependencies]
codetether-approval-core = { path = "../codetether-approval-core", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
