[package]
name = "codetether-computer-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Windows computer-use workflows and OCR"

[target.'cfg(windows)'.dependencies]
anyhow = "1"
codetether-computer-contract = { path = "../codetether-computer-contract", version = "0.1.0" }
codetether-computer-capture = { path = "../codetether-computer-capture", version = "0.1.0" }
codetether-computer-shadow = { path = "../codetether-computer-shadow", version = "0.1.0" }
codetether-platform = { path = "../codetether-platform", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "time", "macros", "io-util"] }
uuid = { version = "1.24.0", features = ["v4"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Storage_Packaging_Appx",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Registry", "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
