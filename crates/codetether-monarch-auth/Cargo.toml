[package]
name = "codetether-monarch-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pinned native OAuth authorization for the official Monarch MCP service"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
directories = "6"
codetether-secrets = { path = "../codetether-secrets", version = "0.1.0" }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }