[package]
name = "codetether-run-jsonl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Run lifecycle and thread-event JSONL presentation"

[dependencies]
anyhow = "1"
chrono = "0.4"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-thread-store = { path = "../codetether-thread-store", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
