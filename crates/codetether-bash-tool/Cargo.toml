[package]
name = "codetether-bash-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Noninteractive bash tool with shared sandbox and approval policy"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
codetether-bash-policy = { path = "../codetether-bash-policy", version = "0.1.0" }
codetether-command-environment = { path = "../codetether-command-environment", version = "0.1.0" }
codetether-command-guard = { path = "../codetether-command-guard", version = "0.1.0" }
codetether-command-shell = { path = "../codetether-command-shell", version = "0.1.0" }
codetether-github-auth = { path = "../codetether-github-auth", version = "0.1.0" }
codetether-process-capture = { path = "../codetether-process-capture", version = "0.1.0" }
codetether-sandbox-policy = { path = "../codetether-sandbox-policy", version = "0.1.0" }
codetether-sandbox-runtime = { path = "../codetether-sandbox-runtime", version = "0.1.0" }
codetether-telemetry = { path = "../codetether-telemetry", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["process"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
