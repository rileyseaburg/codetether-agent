[package]
name = "codetether-native-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native worker state, registration, workspace synchronization and terminal bridge"

[dependencies]
codetether-native-providers = { path = "../codetether-native-providers", version = "4.7.6-dev.38" }
codetether-a2a-http = { path = "../codetether-a2a-http", version = "0.1.0" }
codetether-tui-worker = { path = "../codetether-tui-worker", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.13.2", features = ["json", "stream", "rustls", "multipart", "form", "blocking"], default-features = false }
codetether-a2a-worker-core = { path = "../codetether-a2a-worker-core", version = "0.1.0" }
codetether-provider-policy = { path = "../codetether-provider-policy", version = "0.1.0" }
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
tokio = { version = "1", features = ["sync", "rt", "time"] }
