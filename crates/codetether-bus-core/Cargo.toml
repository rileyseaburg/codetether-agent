[package]
name = "codetether-bus-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared agent bus contracts and delivery policy"
license = "MIT"

[dependencies]
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

dashmap = "6"
uuid = { version = "1.24.0", features = ["v4"] }
tracing = "0.1"

anyhow = "1.0.104"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
