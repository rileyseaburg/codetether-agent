[package]
name = "codetether-computer-shadow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HWND-targeted shadow input planning, validation and execution"

[dependencies]
anyhow = "1"
codetether-computer-contract = { path = "../codetether-computer-contract", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
codetether-platform = { path = "../codetether-platform", version = "0.1.0" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
