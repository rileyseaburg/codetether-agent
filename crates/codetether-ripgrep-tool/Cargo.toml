[package]
name = "codetether-ripgrep-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ripgrep command tool and output handling for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
