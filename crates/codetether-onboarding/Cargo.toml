[package]
name = "codetether-onboarding"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Interactive first-run account onboarding"

[dependencies]
anyhow = "1"
codetether-user-auth = { path = "../codetether-user-auth", version = "0.1.0" }
codetether-user-auth-cli = { path = "../codetether-user-auth-cli", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
