[package]
name = "codetether-session-listing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cache-aware session discovery, listing and summary merging"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
codetether-session-metadata = { path = "../codetether-session-metadata", version = "0.1.0" }
codetether-session-codec = { path = "../codetether-session-codec", version = "0.1.0" }
codetether-session-location = { path = "../codetether-session-location", version = "0.1.0" }
codetether-session-store = { path = "../codetether-session-store", version = "0.1.0" }
codetether-workspace-index = { path = "../codetether-workspace-index", version = "0.1.0" }
codetether-session-title = { path = "../codetether-session-title", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt"] }
tracing = "0.1"
