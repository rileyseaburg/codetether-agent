[package]
name = "codetether-bedrock-refresh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Silent Bedrock SSO refresh and metadata-preserving secret persistence"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
codetether-bedrock-auth = { path = "../codetether-bedrock-auth", version = "0.1.0" }
codetether-secrets = { path = "../codetether-secrets", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
