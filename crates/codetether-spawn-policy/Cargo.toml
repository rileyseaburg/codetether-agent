[package]
name = "codetether-spawn-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Owner-scoped spawn identity reservations and nesting-depth admission"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
