[package]
name = "codetether-user-auth-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "User registration and login command prompts and reporting"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
codetether-user-auth = { path = "../codetether-user-auth", version = "0.1.0" }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
