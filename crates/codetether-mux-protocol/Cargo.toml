[package]
name = "codetether-mux-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Mux control message schemas and bounded JSON-lines transport"

[dependencies]
anyhow = "1"
codetether-mux-model = { path = "../codetether-mux-model", version = "0.1.0" }
codetether-worktree-lease = { path = "../codetether-worktree-lease", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }
