[package]
name = "codetether-advanced-edit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "File editing with ordered exact and whitespace-tolerant matching strategies"

[dependencies]
anyhow = "1"
