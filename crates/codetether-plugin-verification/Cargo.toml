[package]
name = "codetether-plugin-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Plugin manifest signing and content-verified registration"

[dependencies]
anyhow = "1"
hex = "0.4"
hmac = "0.13.0"
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["fs", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
