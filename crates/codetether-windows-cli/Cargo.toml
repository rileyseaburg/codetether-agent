[package]
name = "codetether-windows-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Model-free Windows readiness diagnostics and computer worker entry point"

[dependencies]
anyhow = "1"
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-computer-tool = { path = "../codetether-computer-tool", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
