[package]
name = "codetether-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Editor backends, file buffers, highlighting, input and terminal rendering"

[dependencies]
codetether-fuzzy-finder = { path = "../codetether-fuzzy-finder", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-message-formatter = { path = "../codetether-message-formatter", version = "0.1.0" }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false }
ropey = "1.6"
