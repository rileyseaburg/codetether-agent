[package]
name = "codetether-mux-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Private mux discovery records and workspace/session lookup"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
codetether-mux-model = { path = "../codetether-mux-model", version = "0.1.0" }
directories = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
