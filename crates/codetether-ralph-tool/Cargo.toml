[package]
name = "codetether-ralph-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ralph lifecycle tool with PRD actions, cleanup and result reporting"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-ralph-core = { path = "../codetether-ralph-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
