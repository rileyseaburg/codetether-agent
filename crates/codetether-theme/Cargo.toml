[package]
name = "codetether-theme"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Serializable CodeTether themes with optional terminal rendering"
license = "MIT"

[features]
default = []
ratatui = ["dep:ratatui"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.151"
