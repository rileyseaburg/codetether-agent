[package]
name = "codetether-proactive-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Proactive context runtime registry, scheduling and worker capacity"

[dependencies]
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-proactive-planning = { path = "../codetether-proactive-planning", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
tokio = { version = "1", features = ["sync"] }
