[package]
name = "codetether-provider-bonsai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Bonsai model loading and provider execution"
license = "MIT"

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
candle-cuda = ["candle", "candle-core/cuda", "candle-transformers/cuda"]
tetherscript = ["dep:tetherscript", "dep:codetether-tetherscript-values"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tetherscript-values = { path = "../codetether-tetherscript-values", version = "0.1.0", optional = true }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.1", optional = true }
tetherscript = { version = "0.1.0-alpha.30", features = ["tera", "openssl-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
