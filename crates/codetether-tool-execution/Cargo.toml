[package]
name = "codetether-tool-execution"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Authorized tool invocation, progress lifetime and result auditing"

[dependencies]
async-trait = "0.1"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-tool-reporting = { path = "../codetether-tool-reporting", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
