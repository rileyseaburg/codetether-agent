[package]
name = "codetether-refactor-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Refactor line-budget checks and displaced-code detection"

[dependencies]
anyhow = "1"
async-trait = "0.1"
glob = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process"] }
toml = "1.1.4"
