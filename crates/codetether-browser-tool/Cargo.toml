[package]
name = "codetether-browser-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Browser control tool using the shared CodeTether browser runtime"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-browser = { path = "../codetether-browser", version = "0.1.1" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
