[package]
name = "codetether-bus-sse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "General bus and task-output server-sent event conversion"

[dependencies]
async-stream = "0.3"
axum = "0.8"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-http-auth = { path = "../codetether-http-auth", version = "0.1.0" }
futures = "0.3"
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
