[package]
name = "codetether-session-steering"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session input steering, activity-aware inboxes and local owner transport"

[dependencies]
anyhow = "1"
codetether-collaboration-state = { path = "../codetether-collaboration-state", version = "0.1.0" }
codetether-image = { path = "../codetether-image", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-runtime = { path = "../codetether-session-runtime", version = "0.1.0" }
directories = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
