[package]
name = "codetether-terminal-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Interactive terminal lifecycle, panic recovery, and shutdown signals"

[dependencies]
anyhow = "1"
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "signal", "macros"] }
