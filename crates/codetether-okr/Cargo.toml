[package]
name = "codetether-okr"
version = "0.1.0"
edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "Objectives, key results, and run tracking with file persistence for CodeTether"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
codetether-paths = { path = "../codetether-paths", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "sync"] }
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.25.0"
tokio = { version = "1.53.1", features = ["full"] }
