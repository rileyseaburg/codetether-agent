[package]
name = "codetether-codex-discovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Read-only discovery and summary scans of Codex rollout archives"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
codetether-codex-records = { path = "../codetether-codex-records", version = "0.1.0" }
codetether-session-title = { path = "../codetether-session-title", version = "0.1.0" }
serde_json = "1"
tracing = "0.1"
walkdir = "2"
