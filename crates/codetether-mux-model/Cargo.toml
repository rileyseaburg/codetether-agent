[package]
name = "codetether-mux-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Mux snapshots, isolated session/window state and legacy decoding"

[dependencies]
anyhow = "1"
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
