[package]
name = "codetether-worker-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Worker CLI credentials and shared HTTP lifecycle coordination"

[dependencies]
anyhow = "1"
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-user-auth = { path = "../codetether-user-auth", version = "0.1.0" }
codetether-worker-http = { path = "../codetether-worker-http", version = "0.1.0" }
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
