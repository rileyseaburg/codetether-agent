[package]
name = "codetether-collaboration-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Collaboration lifecycle tools with trusted agent-runtime context"

[dependencies]
codetether-collaboration-input = { path = "../codetether-collaboration-input", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
