[package]
name = "codetether-task-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Task queue HTTP operations and process-local dispatch"

[dependencies]
axum = "0.8"
chrono = "0.4"
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-task-queue = { path = "../codetether-task-queue", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
