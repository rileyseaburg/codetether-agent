[package]
name = "codetether-collaboration-input"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Structured collaboration input validation and durable image attachments"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
codetether-image = { path = "../codetether-image", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
