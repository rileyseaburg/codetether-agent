[package]
name = "codetether-todo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session-isolated todo storage and tools for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
codetether-native-approval = { path = "../codetether-native-approval", version = "0.1.0", features = ["test-support"] }
tempfile = "3"
