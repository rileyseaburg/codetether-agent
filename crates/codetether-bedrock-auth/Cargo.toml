[package]
name = "codetether-bedrock-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bedrock credentials, SigV4 signing, and presigned bearer tokens"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4"
hex = "0.4"
hmac = "0.13.0"
parking_lot = "0.12"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.0"
urlencoding = "2"
