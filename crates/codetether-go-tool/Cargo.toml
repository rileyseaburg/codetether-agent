[package]
name = "codetether-go-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Autonomous task-tool orchestration and persisted objective reporting"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-bus-s3 = { path = "../codetether-bus-s3", version = "0.1.0" }
codetether-go-monitor = { path = "../codetether-go-monitor", version = "0.1.0" }
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
