[package]
name = "codetether-worktree"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "Git worktree lifecycle and integration for isolated CodeTether execution"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
codetether-worktree-isolation = { path = "../codetether-worktree-isolation", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.25.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4"] }
