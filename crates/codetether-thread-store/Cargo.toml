[package]
name = "codetether-thread-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Append-only thread event JSONL storage"

[dependencies]
anyhow = "1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
