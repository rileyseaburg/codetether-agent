[package]
name = "codetether-lsp-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "LSP tool operations with host-owned client identity and cache state"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-lsp-core = { path = "../codetether-lsp-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
lsp-types = "0.97.0"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
