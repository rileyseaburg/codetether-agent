[package]
name = "codetether-cognition-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Belief lifecycle, structured extraction and project memory persistence"
license = "MIT"

[dependencies]
tracing = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
regex = "1.13.1"
codetether-util = { path = "../codetether-util", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }

tokio = { version = "1.53.1", features = ["sync", "fs", "time", "rt"] }
