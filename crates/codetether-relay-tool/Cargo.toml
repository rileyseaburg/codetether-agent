[package]
name = "codetether-relay-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Relay coordination and participant lifecycle tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
lazy_static = "1"
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
