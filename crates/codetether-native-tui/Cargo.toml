[package]
name = "codetether-native-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "State-independent terminal UI composition and compatibility modules"

[dependencies]
codetether-agent-identity = { path = "../codetether-agent-identity", version = "0.1.0" }
codetether-autochat-core = { path = "../codetether-autochat-core", version = "0.1.0" }
codetether-chat-layout = { path = "../codetether-chat-layout", version = "0.1.0" }
codetether-chat-model = { path = "../codetether-chat-model", version = "0.1.0" }
codetether-chat-sync = { path = "../codetether-chat-sync", version = "0.1.0" }
codetether-file-picker = { path = "../codetether-file-picker", version = "0.1.0" }
codetether-file-share = { path = "../codetether-file-share", version = "0.1.0" }
codetether-mermaid = { path = "../codetether-mermaid", version = "0.1.0" }
codetether-model-failover = { path = "../codetether-model-failover", version = "0.1.0" }
codetether-relay-okr = { path = "../codetether-relay-okr", version = "0.1.0" }
codetether-terminal-text = { path = "../codetether-terminal-text", version = "0.1.0" }
codetether-tool-panel = { path = "../codetether-tool-panel", version = "0.1.0" }
codetether-tool-preview = { path = "../codetether-tool-preview", version = "0.1.0" }
codetether-tui-models = { path = "../codetether-tui-models", version = "0.1.0" }
codetether-tui-style = { path = "../codetether-tui-style", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
codetether-watchdog = { path = "../codetether-watchdog", version = "0.1.0" }
codetether-workspace-snapshot = { path = "../codetether-workspace-snapshot", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false }

codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-forage-core = { path = "../codetether-forage-core", version = "0.1.0" }
codetether-forage-interactive = { path = "../codetether-forage-interactive", version = "0.1.0" }
codetether-forage-reporting = { path = "../codetether-forage-reporting", version = "0.1.0" }
codetether-forage-runtime = { path = "../codetether-forage-runtime", version = "0.1.0" }
codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-swarm-runtime = { path = "../codetether-swarm-runtime", version = "0.1.0" }
codetether-swarm-view = { path = "../codetether-swarm-view", version = "0.1.0" }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
codetether-message-formatter = { path = "../codetether-message-formatter", version = "0.1.0" }
