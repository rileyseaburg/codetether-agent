[package]
name = "codetether-peer-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Discovered A2A peer turns, bounded polling and observable transcripts"

[dependencies]
anyhow = "1"
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-a2a-discovery = { path = "../codetether-a2a-discovery", version = "0.1.0" }
codetether-a2a-http = { path = "../codetether-a2a-http", version = "0.1.0" }
codetether-agent-trace = { path = "../codetether-agent-trace", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-collaboration-state = { path = "../codetether-collaboration-state", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
dashmap = "6"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
axum = "0.8"
codetether-agent-messages = { path = "../codetether-agent-messages", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
