[package]
name = "codetether-github-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Repository-scoped GitHub command and HTTP credentials for CodeTether"

[dependencies]
anyhow = "1"
codetether-a2a-http = { path = "../codetether-a2a-http", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false }
tokio = { version = "1", features = ["process"] }
