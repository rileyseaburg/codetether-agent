[package]
name = "codetether-batch-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Policy-gated nested tool batches over an application registry"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
