[package]
name = "codetether-process-tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cross-platform ownership of cancellable subprocess trees"

[dependencies]
tokio = { version = "1", features = ["process"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
