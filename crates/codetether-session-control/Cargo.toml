[package]
name = "codetether-session-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session execution ownership, delegated control and same-session handoff"

[dependencies]
anyhow = "1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-runtime = { path = "../codetether-session-runtime", version = "0.1.0" }
codetether-session-steering = { path = "../codetether-session-steering", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"

[dependencies.parking_lot]
version = "0.12"
