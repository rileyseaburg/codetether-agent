[package]
name = "codetether-ralph-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Policy-gated Ralph Git operations and commit provenance"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
codetether-ralph-core = { path = "../codetether-ralph-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
