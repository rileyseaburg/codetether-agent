[package]
name = "codetether-mcp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "MCP client commands and stdio server startup"

[dependencies]
codetether-application-providers = { path = "../codetether-application-providers", version = "0.1.0" }
codetether-application-registry = { path = "../codetether-application-registry", version = "0.1.0" }
codetether-mcp-server = { path = "../codetether-mcp-server", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-mcp-core = { path = "../codetether-mcp-core", version = "0.1.0" }
codetether-mcp-connections = { path = "../codetether-mcp-connections", version = "0.1.0" }
serde = "1"
serde_json = "1"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1"

codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-bus-s3 = { path = "../codetether-bus-s3", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-mcp-target = { path = "../codetether-mcp-target", version = "0.1.0" }
