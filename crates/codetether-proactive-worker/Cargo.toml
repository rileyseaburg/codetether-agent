[package]
name = "codetether-proactive-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Coalescing proactive RLM summary workers and projection commits"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-prepared-context = { path = "../codetether-prepared-context", version = "0.1.0" }
codetether-proactive-planning = { path = "../codetether-proactive-planning", version = "0.1.0" }
codetether-proactive-runtime = { path = "../codetether-proactive-runtime", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-session-store = { path = "../codetether-session-store", version = "0.1.0" }
codetether-summary-quality = { path = "../codetether-summary-quality", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
