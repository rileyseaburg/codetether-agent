[package]
name = "codetether-indexer-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Codebase index CLI options, output persistence and summary rendering"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
codetether-indexer = { path = "../codetether-indexer", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
