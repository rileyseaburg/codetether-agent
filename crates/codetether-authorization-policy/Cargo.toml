[package]
name = "codetether-authorization-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "OPA and local role/scope authorization evaluation"

[dependencies]
axum = "0.8"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
codetether-http-auth = { path = "../codetether-http-auth", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
