[package]
name = "codetether-cookie-auth-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Provider cookie file parsing, filtering and Vault import CLI"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
codetether-secrets = { path = "../codetether-secrets", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
