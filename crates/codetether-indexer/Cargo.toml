[package]
name = "codetether-indexer"
version = "0.1.0"
edition = "2024"
description = "Codebase scanning, knowledge graphs, and local or remote embedding indexes"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
codetether-paths = { path = "../codetether-paths", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.25.0"
