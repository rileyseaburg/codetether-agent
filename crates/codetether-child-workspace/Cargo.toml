[package]
name = "codetether-child-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Managed child-agent checkout allocation and explicit integration handoff"

[dependencies]
anyhow = "1"
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process"] }
uuid = { version = "1", features = ["v4"] }
