[package]
name = "codetether-approval-diff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Syntax-aware terminal rendering of approval patch previews"

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
