[package]
name = "codetether-forage-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared forage scoring, prompts and summaries"

[dependencies]
anyhow = "1.0.104"
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.24.0", features = ["serde"] }
tracing = "0.1"
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.25.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
