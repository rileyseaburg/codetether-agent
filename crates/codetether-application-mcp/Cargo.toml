[package]
name = "codetether-application-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Authenticated application MCP connection configured by trusted environment"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tls = { path = "../codetether-tls", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
