[package]
name = "codetether-okr-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Objective and key-result repository tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
