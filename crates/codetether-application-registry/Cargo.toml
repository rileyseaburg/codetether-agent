[package]
name = "codetether-application-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Application tool registry construction and shared runtime integration"

[dependencies]
codetether-proactive-context = { path = "../codetether-proactive-context", version = "0.1.0" }
codetether-application-mcp = { path = "../codetether-application-mcp", version = "0.1.0" }
codetether-prior-context-access = { path = "../codetether-prior-context-access", version = "0.1.0" }
tracing = "0.1"
codetether-bash-tool = { path = "../codetether-bash-tool", version = "0.1.0" }
codetether-command-session = { path = "../codetether-command-session", version = "0.1.0" }
codetether-exec-command = { path = "../codetether-exec-command", version = "0.1.0" }
codetether-write-stdin = { path = "../codetether-write-stdin", version = "0.1.0" }
async-trait = "0.1"
codetether-batch-tool = { path = "../codetether-batch-tool", version = "0.1.0" }
codetether-cognition-core = { path = "../codetether-cognition-core", version = "0.1.0" }
codetether-plugin-verification = { path = "../codetether-plugin-verification", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-tool-construction = { path = "../codetether-tool-construction", version = "0.1.0" }
codetether-tool-registry = { path = "../codetether-tool-registry", version = "0.1.0" }
codetether-workspace-tools = { path = "../codetether-workspace-tools", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
codetether-native-approval = { path = "../codetether-native-approval", version = "0.1.0", features = ["test-support"] }
codetether-native-runtime-policy = { path = "../codetether-native-runtime-policy", version = "0.1.0" }
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-command-shell = { path = "../codetether-command-shell", version = "0.1.0" }
codetether-sandbox-policy = { path = "../codetether-sandbox-policy", version = "0.1.0" }
codetether-sandbox-runtime = { path = "../codetether-sandbox-runtime", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
codetether-command-guard = { path = "../codetether-command-guard", version = "0.1.0" }
codetether-file-tools = { path = "../codetether-file-tools", version = "0.1.0" }
