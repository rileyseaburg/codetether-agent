[package]
name = "codetether-vectordb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "Typed vector storage, similarity search, and local embeddings for CodeTether"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.25.0"