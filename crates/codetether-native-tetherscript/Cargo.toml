[package]
name = "codetether-native-tetherscript"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native TetherScript plugin and computer policy bindings"

[features]
default = ["tetherscript"]
tetherscript = []

[dependencies]
codetether-computer-tool = { path = "../codetether-computer-tool", version = "0.1.0" }
codetether-native-runtime-policy = { path = "../codetether-native-runtime-policy", version = "0.1.0" }
codetether-tetherscript-computer = { path = "../codetether-tetherscript-computer", version = "0.1.0" }
codetether-tetherscript-tool = { path = "../codetether-tetherscript-tool", version = "0.1.0" }
codetether-tetherscript-values = { path = "../codetether-tetherscript-values", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
