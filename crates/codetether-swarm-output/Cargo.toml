[package]
name = "codetether-swarm-output"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Deadline-bound tool output summarization and rendering for swarm agents"

[dependencies]
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
