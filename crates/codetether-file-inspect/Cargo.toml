[package]
name = "codetether-file-inspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Directory tree, metadata and text preview tools for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
