[package]
name = "codetether-image-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Image generation and editing with Vault-backed credentials"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-provider-codex = { path = "../codetether-provider-codex", version = "0.1.0" }
codetether-secrets = { path = "../codetether-secrets", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
