[package]
name = "codetether-tetherscript-computer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "TetherScript computer capability with host-supplied policy and backend"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tetherscript-values = { path = "../codetether-tetherscript-values", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tetherscript = "0.1.0-alpha.30"
tokio = { version = "1", features = ["rt", "net", "time"] }
