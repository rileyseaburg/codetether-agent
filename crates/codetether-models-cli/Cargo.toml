[package]
name = "codetether-models-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Provider model discovery, capability enrichment and CLI rendering"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
