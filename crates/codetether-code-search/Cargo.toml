[package]
name = "codetether-code-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Contextual workspace code-search tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
glob = "0.3.4"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
