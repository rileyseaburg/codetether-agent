[package]
name = "codetether-cognition-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cognition HTTP projections and event streaming"

[dependencies]
anyhow = "1"
axum = "0.8"
codetether-cognition-core = { path = "../codetether-cognition-core", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync"] }
