[package]
name = "codetether-audit-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP request auditing and audit-history query behavior"

[dependencies]
axum = "0.8"
chrono = "0.4"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
