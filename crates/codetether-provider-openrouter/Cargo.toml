[package]
name = "codetether-provider-openrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenRouter request policy, catalog discovery, completion, and stream parsing"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
futures = "0.3.34"
parking_lot = "0.12"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
