[package]
name = "codetether-swarm-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Direct swarm tool invocation parsing, model selection and result reporting"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-provider-policy = { path = "../codetether-provider-policy", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
