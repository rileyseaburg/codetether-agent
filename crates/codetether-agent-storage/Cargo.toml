[package]
name = "codetether-agent-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Durable agent sidecar I/O, manifest discovery and scoped lookup"

[dependencies]
async-trait = "0.1"
codetether-agent-registry = { path = "../codetether-agent-registry", version = "0.1.0" }
codetether-collaboration-state = { path = "../codetether-collaboration-state", version = "0.1.0" }
lazy_static = "1"
anyhow = "1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync"] }
tracing = "0.1"
