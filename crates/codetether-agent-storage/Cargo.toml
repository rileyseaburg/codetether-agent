[package]
name = "codetether-agent-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Durable agent sidecar I/O, manifest discovery and scoped lookup"

[dependencies]
anyhow = "1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"
