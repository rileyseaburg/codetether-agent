[package]
name = "codetether-codex-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Codex HTTP streaming and bounded transport retries"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3"
codetether-codex-protocol = { path = "../codetether-codex-protocol", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
futures = "0.3.34"
reqwest = { version = "0.13.2", default-features = false, features = ["stream", "rustls"] }
tokio = { version = "1.53.1", features = ["time", "sync", "net", "io-util"] }
tracing = "0.1"
serde_json = "1.0.151"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
