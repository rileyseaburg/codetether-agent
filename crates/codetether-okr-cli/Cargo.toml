[package]
name = "codetether-okr-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "OKR repository command dispatch and reporting"

[dependencies]
anyhow = "1"
chrono = "0.4"
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
