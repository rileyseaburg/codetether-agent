[package]
name = "codetether-native-goal-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native goal-tool storage, verified transitions and verdict journaling"

[dependencies]
anyhow = "1"
serde_json = "1"
codetether-goal-core = { path = "../codetether-goal-core", version = "0.1.0" }
codetether-goal-tools = { path = "../codetether-goal-tools", version = "0.1.0" }
codetether-goal-verification = { path = "../codetether-goal-verification", version = "0.1.0" }
codetether-native-goals = { path = "../codetether-native-goals", version = "0.1.0" }
async-trait = "0.1"
codetether-application-registry = { path = "../codetether-application-registry", version = "0.1.0" }
codetether-native-providers = { path = "../codetether-native-providers", version = "4.7.6-dev.38" }
codetether-native-swarm = { path = "../codetether-native-swarm", version = "0.1.0" }

codetether-session-task = { path = "../codetether-session-task", version = "0.1.0" }

codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-tool-registry = { path = "../codetether-tool-registry", version = "0.1.0" }

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
codetether-native-approval = { path = "../codetether-native-approval", version = "0.1.0", features = ["test-support"] }
