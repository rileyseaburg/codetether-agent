[package]
name = "codetether-memory-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Persistent memory tool with caller-owned automatic embeddings"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-memory-core = { path = "../codetether-memory-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-vectordb = { path = "../codetether-vectordb", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
