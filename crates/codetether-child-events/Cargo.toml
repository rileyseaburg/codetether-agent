[package]
name = "codetether-child-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Child event collection, inactivity deadlines and cancellation-safe task ownership"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
