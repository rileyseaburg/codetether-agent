[package]
name = "codetether-forage-scoring"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Optional forage score plugin inputs, execution and result policy"

[features]
tetherscript = ["dep:anyhow", "dep:codetether-tool-core", "dep:serde_json", "dep:tokio"]

[dependencies]
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
anyhow = { version = "1", optional = true }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
