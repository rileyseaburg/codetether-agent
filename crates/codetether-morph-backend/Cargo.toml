[package]
name = "codetether-morph-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Morph editing transports with caller-owned provider resolution"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
