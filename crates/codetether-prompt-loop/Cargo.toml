[package]
name = "codetether-prompt-loop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Prompt-turn state, normalized calls and pre-execution guard ordering"

[dependencies]
codetether-edit-policy = { path = "../codetether-edit-policy", version = "0.1.0" }
codetether-prompt-policy = { path = "../codetether-prompt-policy", version = "0.1.0" }
codetether-runtime-policy = { path = "../codetether-runtime-policy", version = "0.1.0" }
codetether-repeat-guard = { path = "../codetether-repeat-guard", version = "0.1.0" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-provider-policy = { path = "../codetether-provider-policy", version = "0.1.0" }
codetether-build-policy = { path = "../codetether-build-policy", version = "0.1.0" }
anyhow = "1"
tracing = "0.1"

codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
tokio = { version = "1", features = ["sync"] }

codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-tool-recovery = { path = "../codetether-tool-recovery", version = "0.1.0" }
codetether-tool-reporting = { path = "../codetether-tool-reporting", version = "0.1.0" }

codetether-tool-call-parser = { path = "../codetether-tool-call-parser", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }

codetether-tool-outcome = { path = "../codetether-tool-outcome", version = "0.1.0" }

codetether-stream-bounds = { path = "../codetether-stream-bounds", version = "0.1.0" }
