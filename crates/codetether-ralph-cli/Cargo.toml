[package]
name = "codetether-ralph-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ralph CLI policy and native runtime interface"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-ralph-core = { path = "../codetether-ralph-core", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
