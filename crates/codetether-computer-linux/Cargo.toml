[package]
name = "codetether-computer-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Linux desktop observation and bounded screenshot execution"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
codetether-computer-contract = { path = "../codetether-computer-contract", version = "0.1.0" }
codetether-computer-capture = { path = "../codetether-computer-capture", version = "0.1.0" }
codetether-process-tree = { path = "../codetether-process-tree", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
serde_json = "1"
tempfile = "3.25.0"
tokio = { version = "1", features = ["process", "rt", "time", "macros"] }
which = "8"

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "0.23.1"
