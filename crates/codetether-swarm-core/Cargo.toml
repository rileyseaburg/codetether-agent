[package]
name = "codetether-swarm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Swarm execution contracts, metrics and event payloads"
license = "MIT"

[dependencies]
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }
codetether-runtime-input = { path = "../codetether-runtime-input", version = "0.1.0" }
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
base64 = "0.23.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
async-trait = "0.1.92"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
codetether-agent-core = { path = "../codetether-agent-core", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["sync", "time", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
serde_json = "1.0.151"

anyhow = "1.0.104"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
