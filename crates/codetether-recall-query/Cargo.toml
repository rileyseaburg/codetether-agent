[package]
name = "codetether-recall-query"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local recall query dispatch, bounded search and direct migration"

[dependencies]
codetether-session-recall = { path = "../codetether-session-recall", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
codetether-recall-index = { path = "../codetether-recall-index", version = "0.1.0" }
codetether-recall-store = { path = "../codetether-recall-store", version = "0.1.0" }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
