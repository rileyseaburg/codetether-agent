[package]
name = "codetether-verifier-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Verifier model selection, verdicts and execution observations"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
codetether-config = { path = "../codetether-config", version = "0.1.0" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
