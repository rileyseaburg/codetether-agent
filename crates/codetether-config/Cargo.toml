[package]
name = "codetether-config"
version = "0.1.0"
edition = "2024"
description = "Configuration loading, policy precedence, and workspace trust for CodeTether"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
codetether-paths = { path = "../codetether-paths", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-theme = { path = "../codetether-theme", version = "0.1.0", default-features = false }
directories = "6"
futures = "0.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync"] }
toml = "1.1.4+spec-1.1.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.25.0"
