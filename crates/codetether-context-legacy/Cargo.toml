[package]
name = "codetether-context-legacy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Legacy transcript context derivation and compression coordination"

[dependencies]
anyhow = "1"
codetether-context-compression = { path = "../codetether-context-compression", version = "0.1.0" }
codetether-context-enforcement = { path = "../codetether-context-enforcement", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-rlm-background = { path = "../codetether-rlm-background", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
tokio = { version = "1", features = ["sync"] }
