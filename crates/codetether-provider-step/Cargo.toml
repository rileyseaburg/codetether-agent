[package]
name = "codetether-provider-step"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Scoped provider completion and per-step deadline policy"

[dependencies]
anyhow = "1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-stream-restart = { path = "../codetether-stream-restart", version = "0.1.0" }
tokio = { version = "1", features = ["sync", "time"] }
