[package]
name = "codetether-session-fork"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Non-destructive edited-conversation branching policy"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-chat-model = { path = "../codetether-chat-model", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-metadata = { path = "../codetether-session-metadata", version = "0.1.0" }
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
