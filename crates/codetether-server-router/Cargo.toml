[package]
name = "codetether-server-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Application HTTP route composition and mandatory middleware"

[dependencies]
axum = "0.8"
codetether-audit-http = { path = "../codetether-audit-http", version = "0.1.0" }
codetether-authorization-policy = { path = "../codetether-authorization-policy", version = "0.1.0" }
codetether-bus-sse = { path = "../codetether-bus-sse", version = "0.1.0" }
codetether-cognition-api = { path = "../codetether-cognition-api", version = "0.1.0" }
codetether-event-replay = { path = "../codetether-event-replay", version = "0.1.0" }
codetether-http-auth = { path = "../codetether-http-auth", version = "0.1.0" }
codetether-k8s-api = { path = "../codetether-k8s-api", version = "0.1.0" }
codetether-plugin-http = { path = "../codetether-plugin-http", version = "0.1.0" }
codetether-server-cors = { path = "../codetether-server-cors", version = "0.1.0" }
codetether-server-status = { path = "../codetether-server-status", version = "0.1.0" }
codetether-task-api = { path = "../codetether-task-api", version = "0.1.0" }
codetether-task-ingest = { path = "../codetether-task-ingest", version = "0.1.0" }
