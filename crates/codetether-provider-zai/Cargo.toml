[package]
name = "codetether-provider-zai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Z.AI chat completion and streaming client for CodeTether"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
futures = "0.3.34"
once_cell = "1.19"
regex = "1.13.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "net", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"