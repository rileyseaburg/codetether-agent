[package]
name = "codetether-session-realtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session WebSocket framing, steering and ordered event transport"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-session-steering = { path = "../codetether-session-steering", version = "0.1.0" }
codetether-thread-events = { path = "../codetether-thread-events", version = "0.1.0" }
codetether-thread-store = { path = "../codetether-thread-store", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
