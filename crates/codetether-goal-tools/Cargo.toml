[package]
name = "codetether-goal-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Model-facing goal creation, editing and result contracts"

[dependencies]
anyhow = "1"
chrono = "0.4"
codetether-goal-core = { path = "../codetether-goal-core", version = "0.1.0" }
codetether-session-task = { path = "../codetether-session-task", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
