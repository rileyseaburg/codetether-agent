[package]
name = "codetether-lsp-preflight"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Approval-time proposed-edit diagnostics and language-server backoff"

[dependencies]
anyhow = "1"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
codetether-lsp-core = { path = "../codetether-lsp-core", version = "0.1.0" }
codetether-lsp-tool = { path = "../codetether-lsp-tool", version = "0.1.0" }
codetether-patch = { path = "../codetether-patch", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
