[package]
name = "codetether-rlm-background"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Background RLM routing, caching and worker execution"

[dependencies]
anyhow = "1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-request-tokens = { path = "../codetether-request-tokens", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
