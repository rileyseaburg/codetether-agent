[package]
name = "codetether-session-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared session metadata, safe debug projection and listing records"

[dependencies]
codetether-tracked-vec = { path = "../codetether-tracked-vec", version = "0.1.0" }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-history-sink = { path = "../codetether-history-sink", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-run-checkpoint = { path = "../codetether-run-checkpoint", version = "0.1.0" }
codetether-session-title = { path = "../codetether-session-title", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
