[package]
name = "codetether-lsp-core"
version = "0.1.0"
edition = "2024"
description = "LSP protocol types, server configuration, and owned stdio transport"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
codetether-config = { path = "../codetether-config", version = "0.1.0" }
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
which = "8.0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.25.0"
tokio = { version = "1.53.1", features = ["fs", "test-util"] }
