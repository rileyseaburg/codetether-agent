[package]
name = "codetether-repeat-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Per-turn repeated edit detection using stable input signatures"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-edit-policy = { path = "../codetether-edit-policy", version = "0.1.0" }
