[package]
name = "codetether-connect-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "SSH connection CLI and remote device-authentication orchestration"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["io-util", "process"] }
