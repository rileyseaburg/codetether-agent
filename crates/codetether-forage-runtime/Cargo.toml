[package]
name = "codetether-forage-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Forage startup, discovery, cycle execution and live-service ownership"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-bus-s3 = { path = "../codetether-bus-s3", version = "0.1.0" }
codetether-cli-options = { path = "../codetether-cli-options", version = "0.1.0" }
codetether-forage-core = { path = "../codetether-forage-core", version = "0.1.0" }
codetether-forage-execution = { path = "../codetether-forage-execution", version = "0.1.0" }
codetether-forage-reporting = { path = "../codetether-forage-reporting", version = "0.1.0" }
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
