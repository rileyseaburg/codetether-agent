[package]
name = "codetether-token-display"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Terminal token usage, context and cost presentation"

[dependencies]
codetether-cost-guard = { path = "../codetether-cost-guard", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-telemetry = { path = "../codetether-telemetry", version = "0.1.0" }
codetether-theme = { path = "../codetether-theme", version = "0.1.0", features = ["ratatui"] }
ratatui = { version = "0.30.2", default-features = false }
