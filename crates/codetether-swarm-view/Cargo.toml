[package]
name = "codetether-swarm-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Swarm state, event reduction and terminal presentation"

[dependencies]
codetether-chat-model = { path = "../codetether-chat-model", version = "0.1.0" }
codetether-agent-core = { path = "../codetether-agent-core", version = "0.1.0" }
codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-view-retention = { path = "../codetether-view-retention", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false }
tokio = { version = "1", features = ["sync", "rt"] }
