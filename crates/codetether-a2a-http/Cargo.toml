[package]
name = "codetether-a2a-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP client and JSON-RPC task-state operations for CodeTether A2A"

[dependencies]
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
tracing = "0.1"
async-trait = "0.1.92"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
uuid = { version = "1.24.0", features = ["v4"] }
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
anyhow = "1.0.104"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net"] }
