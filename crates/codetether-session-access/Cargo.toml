[package]
name = "codetether-session-access"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Workspace authorization and recovery error boundaries"

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "sync", "time"] }
