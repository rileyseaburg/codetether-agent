[package]
name = "codetether-task-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Task submission, workspace resolution and CLI result reporting"

[dependencies]
anyhow = "1"
codetether-user-auth = { path = "../codetether-user-auth", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
