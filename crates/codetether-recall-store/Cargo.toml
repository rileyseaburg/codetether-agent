[package]
name = "codetether-recall-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Recall sidecar persistence, catalogs and stale-write protection"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-recall-index = { path = "../codetether-recall-index", version = "0.1.0" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "sync"] }
