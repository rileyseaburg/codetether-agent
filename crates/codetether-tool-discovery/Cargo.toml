[package]
name = "codetether-tool-discovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Dynamic tool discovery records and heartbeat-expiring registry"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync", "rt", "time"] }
axum = "0.8"
tracing = "0.1"
