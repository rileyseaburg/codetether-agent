[package]
name = "codetether-context-summarize"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cached context summary lookup and production orchestration"

[dependencies]
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-rlm-background = { path = "../codetether-rlm-background", version = "0.1.0" }
codetether-summary-producer = { path = "../codetether-summary-producer", version = "0.1.0" }
codetether-tracked-vec = { path = "../codetether-tracked-vec", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
codetether-context-loader = { path = "../codetether-context-loader", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
