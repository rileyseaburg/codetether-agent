[package]
name = "codetether-confirm-multiedit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Multi-file edit confirmation with ordered previews and writes"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.1.2"
tokio = { version = "1", features = ["fs"] }
