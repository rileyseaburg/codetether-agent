[package]
name = "codetether-oauth-callback"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "OAuth loopback callback capture and pasted URL/query parsing"

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }
tracing = "0.1"
urlencoding = "2"
