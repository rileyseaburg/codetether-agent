[package]
name = "codetether-prepared-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Prepared context indexes, freshness checks and sidecar storage"

[dependencies]
anyhow = "1"
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
