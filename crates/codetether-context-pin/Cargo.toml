[package]
name = "codetether-context-pin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Context turn pinning over tracked session storage"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-context-loader = { path = "../codetether-context-loader", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
