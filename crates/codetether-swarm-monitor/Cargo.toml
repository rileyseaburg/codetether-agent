[package]
name = "codetether-swarm-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Direct swarm lifecycle observation and TUI event delivery"

[dependencies]
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-swarm-tool = { path = "../codetether-swarm-tool", version = "0.1.0" }
codetether-swarm-view = { path = "../codetether-swarm-view", version = "0.1.0" }
lazy_static = "1.4"
tokio = { version = "1.53.1", features = ["sync"] }
