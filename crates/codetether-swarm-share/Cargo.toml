[package]
name = "codetether-swarm-share"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared swarm result publishing and query tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
