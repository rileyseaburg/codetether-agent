[package]
name = "codetether-token-count"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "File token measurement tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
