[package]
name = "codetether-go-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Background autonomous-pipeline state and progress monitoring"

[dependencies]
anyhow = "1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
