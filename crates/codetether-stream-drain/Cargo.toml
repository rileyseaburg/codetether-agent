[package]
name = "codetether-stream-drain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Provider stream draining, bounded accumulation and liveness events"

[dependencies]
anyhow = "1"
codetether-codex-protocol = { path = "../codetether-codex-protocol", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-stream-bounds = { path = "../codetether-stream-bounds", version = "0.1.0" }
codetether-stream-outcome = { path = "../codetether-stream-outcome", version = "0.1.0" }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
