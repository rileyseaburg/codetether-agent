[package]
name = "codetether-webfetch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Authenticated HTTP content retrieval and conversion tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-github-auth = { path = "../codetether-github-auth", version = "0.1.0" }
codetether-tls = { path = "../codetether-tls", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
once_cell = "1.19"
regex = "1.13.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
