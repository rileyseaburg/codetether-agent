[package]
name = "codetether-image-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local and remote image loading tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
