[package]
name = "codetether-voice-stream-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Voice-service speech streaming and browser audio playback"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5.4.1"
tracing = "0.1"
