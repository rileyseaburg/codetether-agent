[package]
name = "codetether-a2a-worker-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable A2A worker primitives for CodeTether"

[lib]
name = "codetether_a2a_worker_core"
path = "src/lib.rs"

[dependencies]
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-forage-core = { path = "../codetether-forage-core", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
async-trait = "0.1.92"
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
codetether-provenance = { path = "../codetether-provenance", version = "0.1.0" }
anyhow = "1.0.104"
codetether-agent-core = { path = "../codetether-agent-core", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

codetether-provider-policy = { path = "../codetether-provider-policy", version = "0.1.0" }

codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }

codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
