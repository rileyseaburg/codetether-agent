[package]
name = "codetether-session-picker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session picker filtering and terminal presentation"

[dependencies]
anyhow = "1"
tracing = "0.1"
chrono = "0.4"
codetether-session-metadata = { path = "../codetether-session-metadata", version = "0.1.0" }
codetether-theme = { path = "../codetether-theme", version = "0.1.0", features = ["ratatui"] }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false }
