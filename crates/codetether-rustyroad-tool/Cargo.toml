[package]
name = "codetether-rustyroad-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "First-party RustyRoad MCP process, protocol and tool adapter"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-mcp-core = { path = "../codetether-mcp-core", version = "0.1.0" }
codetether-mcp-tools = { path = "../codetether-mcp-tools", version = "0.1.0" }
codetether-process-tree = { path = "../codetether-process-tree", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "time", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
