[package]
name = "codetether-vault-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Vault CLI configuration, private token input and login flows"

[dependencies]
which = "8.0.5"
anyhow = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
codetether-models-cli = { path = "../codetether-models-cli", version = "0.1.0" }
codetether-secrets = { path = "../codetether-secrets", version = "0.1.0" }
crossterm = "0.29"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
