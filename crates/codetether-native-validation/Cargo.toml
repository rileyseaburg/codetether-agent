[package]
name = "codetether-native-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native refactor, LSP and sandboxed ESLint validation services"

[features]
default = []
tetherscript = ["dep:codetether-native-tetherscript"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
codetether-bash-tool = { path = "../codetether-bash-tool", version = "0.1.0" }
codetether-lsp-core = { path = "../codetether-lsp-core", version = "0.1.0" }
codetether-native-runtime-policy = { path = "../codetether-native-runtime-policy", version = "0.1.0" }
codetether-refactor-guard = { path = "../codetether-refactor-guard", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-validation = { path = "../codetether-validation", version = "0.1.0" }
codetether-native-lsp = { path = "../codetether-native-lsp", version = "4.7.6-dev.38" }
codetether-native-tetherscript = { path = "../codetether-native-tetherscript", version = "0.1.0", optional = true }
