[package]
name = "codetether-file-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Core file access tools with telemetry for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-telemetry = { path = "../codetether-telemetry", version = "0.1.0" }
glob = "0.3.4"
ignore = "0.4.33"
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
