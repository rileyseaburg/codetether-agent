[package]
name = "codetether-mux-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Authenticated mux workspace server and session request handlers"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
codetether-mux-agent-task = { path = "../codetether-mux-agent-task", version = "0.1.0" }
codetether-mux-model = { path = "../codetether-mux-model", version = "0.1.0" }
codetether-mux-protocol = { path = "../codetether-mux-protocol", version = "0.1.0" }
codetether-mux-pty = { path = "../codetether-mux-pty", version = "0.1.0" }
codetether-mux-registry = { path = "../codetether-mux-registry", version = "0.1.0" }
codetether-mux-workspace = { path = "../codetether-mux-workspace", version = "0.1.0" }
codetether-session-steering = { path = "../codetether-session-steering", version = "0.1.0" }
codetether-worktree-lease = { path = "../codetether-worktree-lease", version = "0.1.0" }
rand = "0.10.2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
codetether-mux-client = { path = "../codetether-mux-client", version = "0.1.0" }
tempfile = "3"
