[package]
name = "codetether-swarm-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Application-bound swarm agent turns, tool lifecycle and event publication"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-provider-step = { path = "../codetether-provider-step", version = "0.1.0" }
codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }
codetether-swarm-bus = { path = "../codetether-swarm-bus", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-swarm-output = { path = "../codetether-swarm-output", version = "0.1.0" }
codetether-tool-call-parser = { path = "../codetether-tool-call-parser", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
codetether-swarm-local-job = { path = "../codetether-swarm-local-job", version = "0.1.0" }
codetether-workspace-tools = { path = "../codetether-workspace-tools", version = "0.1.0" }
codetether-swarm-orchestrator = { path = "../codetether-swarm-orchestrator", version = "0.1.0" }
codetether-swarm-remote-runtime = { path = "../codetether-swarm-remote-runtime", version = "0.1.0" }
