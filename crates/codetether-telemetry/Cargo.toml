[package]
name = "codetether-telemetry"
version = "0.1.0"
edition = "2024"
description = "Process telemetry, token accounting, transport observations, and memory guards"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.25.0"
