[package]
name = "codetether-task-queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "In-process task queue and atomic worker state transitions"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
