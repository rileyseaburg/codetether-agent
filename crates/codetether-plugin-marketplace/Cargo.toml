[package]
name = "codetether-plugin-marketplace"
version = "0.1.0"
edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "MCP plugin registry, integrity verification, and hot-loading for CodeTether"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
