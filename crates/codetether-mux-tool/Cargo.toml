[package]
name = "codetether-mux-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Mux manager tool schema, lifecycle safeguards and control dispatch"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-mux-control = { path = "../codetether-mux-control", version = "0.1.0" }
codetether-mux-lifecycle = { path = "../codetether-mux-lifecycle", version = "0.1.0" }
codetether-mux-workspace = { path = "../codetether-mux-workspace", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
