[package]
name = "codetether-workspace-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Workspace-rooted tool installation and swarm capability filtering"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
codetether-bash-tool = { path = "../codetether-bash-tool", version = "0.1.0" }
codetether-git-tool = { path = "../codetether-git-tool", version = "0.1.0" }
