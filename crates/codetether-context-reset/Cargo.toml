[package]
name = "codetether-context-reset"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Agent-authored context reset markers and audit recording"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
