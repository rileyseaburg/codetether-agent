[package]
name = "codetether-bus-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Protocol bus-log state, bounded event conversion and terminal rendering"

[dependencies]
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-theme = { path = "../codetether-theme", version = "0.1.0", features = ["ratatui"] }
codetether-view-retention = { path = "../codetether-view-retention", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false }
serde_json = "1"

[dev-dependencies]
chrono = "0.4"
