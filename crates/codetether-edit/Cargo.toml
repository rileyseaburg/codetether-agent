[package]
name = "codetether-edit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Edit confirmation previews and proposed content reconstruction"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-morph-backend = { path = "../codetether-morph-backend", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
similar = "3.1.2"
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"
