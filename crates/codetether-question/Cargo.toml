[package]
name = "codetether-question"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async session-scoped user questions and choice selection"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
