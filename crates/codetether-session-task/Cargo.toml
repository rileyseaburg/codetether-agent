[package]
name = "codetether-session-task"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session work-item tool and compatibility goal-event dispatch"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
codetether-goal-core = { path = "../codetether-goal-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
