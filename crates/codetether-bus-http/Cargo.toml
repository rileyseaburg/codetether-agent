[package]
name = "codetether-bus-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP SSE ingestion and endpoint discovery for CodeTether bus"

[dependencies]
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
anyhow = "1.0.104"
chrono = "0.4"
futures = "0.3.34"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1"
urlencoding = "2"
