codetether-go-ralph = { path = "../codetether-go-ralph", version = "0.1.0" }
codetether-okr = { path = "../codetether-okr", version = "0.1.0" }
codetether-relay-plan = { path = "../codetether-relay-plan", version = "0.1.0" }
codetether-relay-planner = { path = "../codetether-relay-planner", version = "0.1.0" }
codetether-relay-okr = { path = "../codetether-relay-okr", version = "0.1.0" }
codetether-run-report = { path = "../codetether-run-report", version = "0.1.0" }
uuid = { version = "1", features = ["v4"] }
