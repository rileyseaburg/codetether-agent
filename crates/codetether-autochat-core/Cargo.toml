[package]
name = "codetether-autochat-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared auto-chat request, context and handoff policy"
license = "MIT"

[dependencies]
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-rlm = { path = "../codetether-rlm", version = "0.1.1" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"] }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }

codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
