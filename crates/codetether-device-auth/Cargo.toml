[package]
name = "codetether-device-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Codex and GitHub device authorization HTTP flows"

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
