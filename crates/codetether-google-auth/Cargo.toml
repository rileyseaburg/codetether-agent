[package]
name = "codetether-google-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Google service-account JWT exchange and per-instance token caching"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1"
urlencoding = "2"
