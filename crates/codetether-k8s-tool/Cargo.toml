[package]
name = "codetether-k8s-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Kubernetes tool adapter for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-k8s = { path = "../codetether-k8s", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
