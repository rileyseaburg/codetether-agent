[package]
name = "codetether-run-checkpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Resumable run checkpoint data, transcript extraction and continuation prompts"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
