[package]
name = "codetether-tool-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Executable tool contracts and result adapters for CodeTether"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

tempfile = "3.25.0"
