[package]
name = "codetether-voice-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "REST compatibility bridge for voice-session bus notifications"

[dependencies]
axum = "0.8"
chrono = "0.4"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
