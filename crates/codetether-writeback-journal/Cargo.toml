[package]
name = "codetether-writeback-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Typed stage/reject/commit journal and append-only event persistence"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util"] }
