[package]
name = "codetether-ralph-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ralph story/conflict agent execution and event forwarding"

[dependencies]
async-trait = "0.1"
codetether-ralph-git = { path = "../codetether-ralph-git", version = "0.1.0" }
codetether-bash-tool = { path = "../codetether-bash-tool", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
codetether-agent-core = { path = "../codetether-agent-core", version = "0.1.0" }
codetether-application-registry = { path = "../codetether-application-registry", version = "0.1.0" }
codetether-swarm-agent = { path = "../codetether-swarm-agent", version = "0.1.0" }
anyhow = "1"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-ralph-core = { path = "../codetether-ralph-core", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
