[package]
name = "codetether-goal-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Goal verification protocol, charters, verdict journal and attempt accounting"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
codetether-goal-core = { path = "../codetether-goal-core", version = "0.1.0" }
codetether-verifier-state = { path = "../codetether-verifier-state", version = "0.1.0" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["fs", "io-util"] }

codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
tracing = "0.1"

codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
