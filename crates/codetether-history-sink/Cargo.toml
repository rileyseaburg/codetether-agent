[package]
name = "codetether-history-sink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Durable JSONL history uploads and pointer reads over MinIO/S3"

[dependencies]
anyhow = "1"
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
minio = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
