[package]
name = "codetether-mcp-bus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "MCP bus monitoring tools and Ralph status resources"

[dependencies]
anyhow = "1"
codetether-bus-http = { path = "../codetether-bus-http", version = "0.1.0" }
codetether-mcp-core = { path = "../codetether-mcp-core", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
