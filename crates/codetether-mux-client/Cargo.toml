[package]
name = "codetether-mux-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Authenticated mux connections and client snapshot state"

[dependencies]
anyhow = "1"
codetether-mux-model = { path = "../codetether-mux-model", version = "0.1.0" }
codetether-mux-protocol = { path = "../codetether-mux-protocol", version = "0.1.0" }
codetether-mux-registry = { path = "../codetether-mux-registry", version = "0.1.0" }
tokio = { version = "1", features = ["net"] }
