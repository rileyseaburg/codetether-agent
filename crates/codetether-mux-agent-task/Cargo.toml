[package]
name = "codetether-mux-agent-task"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Session-scoped mux agent child processes and bounded task replay"

[dependencies]
anyhow = "1"
codetether-mux-coordination = { path = "../codetether-mux-coordination", version = "0.1.0" }
libc = "0.2.189"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
