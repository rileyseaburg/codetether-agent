[package]
name = "codetether-context-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Context reset and history browsing CLI with caller-owned session storage"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6.6", features = ["derive"] }
codetether-context-browse = { path = "../codetether-context-browse", version = "0.1.0" }
codetether-context-loader = { path = "../codetether-context-loader", version = "0.1.0" }
codetether-context-reset = { path = "../codetether-context-reset", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde_json = "1"
