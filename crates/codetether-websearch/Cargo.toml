[package]
name = "codetether-websearch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "DuckDuckGo web-search tool for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
html-escape = "0.2.15"
regex = "1.13.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
