[package]
name = "codetether-websearch"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native web-search tool (Bing HTML, DuckDuckGo HTML as secondary) for CodeTether"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
html-escape = "0.2.15"
regex = "1.13.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
