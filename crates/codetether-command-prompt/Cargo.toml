[package]
name = "codetether-command-prompt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Single-line terminal command editing, safe paste and directory completion"

[dependencies]
anyhow = "1"
crossterm = "0.29"
tokio = { version = "1", features = ["rt"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
