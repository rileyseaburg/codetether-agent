[package]
name = "codetether-bedrock-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bedrock request/response protocol, transcript repair, and model policy"
license = "MIT"

[dependencies]
async-stream = "0.3"
futures = "0.3.34"
reqwest = { version = "0.13.2", default-features = false, features = ["stream", "rustls"] }
anyhow = "1.0.104"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
codetether-util = { path = "../codetether-util", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt"] }
base64 = "0.23.1"
codetether-image = { path = "../codetether-image", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
parking_lot = "0.12"
serde_json = "1.0.151"
tracing = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
