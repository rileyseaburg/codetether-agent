[package]
name = "codetether-approval-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Terminal popup rendering for pending approval requests"

[dependencies]
codetether-approval-edit = { path = "../codetether-approval-edit", version = "0.1.0" }
codetether-editor = { path = "../codetether-editor", version = "0.1.0" }
codetether-terminal-clipboard = { path = "../codetether-terminal-clipboard", version = "0.1.0" }
codetether-approval-core = { path = "../codetether-approval-core", version = "0.1.0" }
codetether-approval-queue = { path = "../codetether-approval-queue", version = "0.1.0" }
codetether-approval-diff = { path = "../codetether-approval-diff", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false, features = ["unstable-rendered-line-info"] }

crossterm = "0.29.0"
