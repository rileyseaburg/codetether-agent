[package]
name = "codetether-swarm-local-stage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local swarm stage scheduling, worktrees, collection and integration"

[dependencies]
anyhow = "1"
codetether-audit = { path = "../codetether-audit", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-session-control = { path = "../codetether-session-control", version = "0.1.0" }
codetether-swarm-core = { path = "../codetether-swarm-core", version = "0.1.0" }
codetether-swarm-local-job = { path = "../codetether-swarm-local-job", version = "0.1.0" }
codetether-workspace-tools = { path = "../codetether-workspace-tools", version = "0.1.0" }
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
