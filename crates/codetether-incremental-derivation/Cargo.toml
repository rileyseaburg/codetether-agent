[package]
name = "codetether-incremental-derivation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Incremental context projection using prepared summaries"

[dependencies]
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-request-tokens = { path = "../codetether-request-tokens", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
codetether-context-request = { path = "../codetether-context-request", version = "0.1.0" }
codetether-session-store = { path = "../codetether-session-store", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
