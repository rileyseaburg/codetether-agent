[package]
name = "codetether-provider-anthropic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Anthropic-compatible Messages API conversion, transport, and streaming"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
codetether-image = { path = "../codetether-image", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
futures = "0.3.34"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
