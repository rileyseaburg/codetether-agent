[package]
name = "codetether-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Touched-file validation scope, diagnostics and continuation reports"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-lsp-core = { path = "../codetether-lsp-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process"] }
