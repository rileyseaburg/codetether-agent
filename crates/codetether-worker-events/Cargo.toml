[package]
name = "codetether-worker-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded worker SSE task decoding and observability forwarding"

[dependencies]
anyhow = "1"
codetether-a2a-core = { path = "../codetether-a2a-core", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tracing = "0.1"
