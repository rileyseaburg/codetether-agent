[package]
name = "codetether-worker-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP endpoints and shared state for CodeTether workers"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
codetether-a2a-worker-core = { path = "../codetether-a2a-worker-core", version = "0.1.0" }
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
