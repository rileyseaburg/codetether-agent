[package]
name = "codetether-run-resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Prompt retry and checkpoint orchestration for CLI runs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-run-checkpoint = { path = "../codetether-run-checkpoint", version = "0.1.0" }
codetether-session-events = { path = "../codetether-session-events", version = "0.1.0" }
codetether-step-limit = { path = "../codetether-step-limit", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["sync"] }
