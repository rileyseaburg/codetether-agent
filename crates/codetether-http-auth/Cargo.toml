[package]
name = "codetether-http-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "HTTP authentication state, token extraction and middleware"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
