[package]
name = "codetether-secrets"
version = "0.1.0"
edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "HashiCorp Vault provider secrets, token renewal, and login profiles for CodeTether"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"

[dependencies]
anyhow = "1.0.104"
directories = "6"
parking_lot = "0.12"
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.25.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
vaultrs = "0.8.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
