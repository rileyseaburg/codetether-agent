[package]
name = "codetether-write-stdin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Persistent command input and incremental polling tool"

[dependencies]
anyhow = "1"
async-trait = "0.1"
codetether-command-session = { path = "../codetether-command-session", version = "0.1.0" }
codetether-tool-core = { path = "../codetether-tool-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
