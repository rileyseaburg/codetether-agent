[package]
name = "codetether-ralph-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ralph runtime state ownership and shared service integration"

[dependencies]
codetether-application-registry = { path = "../codetether-application-registry", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
codetether-bus-core = { path = "../codetether-bus-core", version = "0.1.0" }
codetether-context-policy = { path = "../codetether-context-policy", version = "0.1.0" }
codetether-provider-core = { path = "../codetether-provider-core", version = "0.1.0" }
codetether-ralph-agent = { path = "../codetether-ralph-agent", version = "0.1.0" }
codetether-ralph-core = { path = "../codetether-ralph-core", version = "0.1.0" }
codetether-ralph-git = { path = "../codetether-ralph-git", version = "0.1.0" }
codetether-ralph-merge = { path = "../codetether-ralph-merge", version = "0.1.0" }
codetether-ralph-relay = { path = "../codetether-ralph-relay", version = "0.1.0" }
codetether-ralph-run = { path = "../codetether-ralph-run", version = "0.1.0" }
codetether-ralph-sequential = { path = "../codetether-ralph-sequential", version = "0.1.0" }
codetether-ralph-stage = { path = "../codetether-ralph-stage", version = "0.1.0" }
codetether-ralph-task = { path = "../codetether-ralph-task", version = "0.1.0" }
codetether-worktree = { path = "../codetether-worktree", version = "0.1.0" }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
