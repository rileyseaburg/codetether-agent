# Chat is not a checkout. Keep existing conversation storage accessible in place.
# CODETETHER_CHAT_MODE needs the general-chat-aware agent binary.
[Service]
WorkingDirectory=%h/.local/share/codetether-chat
Environment=CODETETHER_DATA_DIR=%h/spotlessbinco/.codetether-agent
Environment=CODETETHER_CHAT_MODE=general
Environment=CODETETHER_CHAT_WORKSPACE=%h/.local/share/codetether-chat
# Compatibility prompt for providers honoring the existing light-prompt override.
# LM Studio and legacy persisted project bindings need the new backend code.
Environment=CODETETHER_LIGHT_SYSTEM_PROMPT=1
Environment="CODETETHER_LOCAL_CUDA_SYSTEM_PROMPT=You are CodeTether Chat, a general-purpose conversational assistant. No project or repository is selected. Follow the user's current question; do not assume coding work or resume previous project tasks. Use available tools, including web search, when helpful. Discover tools with list_tools. Never invent tool results."