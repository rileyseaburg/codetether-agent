[package]
name = "codetether-agent"
version = "4.7.6-dev.38"


edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "A2A-native AI coding agent for the CodeTether ecosystem"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"
exclude = [
    "npm/",
    "dist/",
    "target/",
    "vendor/",
    "doc/",
    "codetether-bin",
    "docs/tui-screenshot.png",
    "prd*.json",
    "ui-prd.json",
    "worktree-prd.json",
    "feature_*.json",
    "benchmark_results.json",
    "subtask*.json",
    "subtask*.md",
    "*.txt",
    "*.py",
    "post.md",
    "gap-inventory.md",
    "content_inventory_document.md",
    "static_analysis_report.md",
    "provider_fields_analysis.md",
    "research_interactive_file_editing_cli_tools.md",
    "test_confirmation.md",
    "test_history_navigation.md",
    "test_theme.toml",
    "DOCUMENTATION_UPDATE_SUMMARY.md",
    "IMPLEMENTATION_ANALYSIS.md",
    "TECHNOLOGY_ASSESSMENT.md",
    "TUI_MODULE_DOCUMENTATION.md",
    "RALPH_DOCUMENTATION.md",
    "docs/assessment_config_main_lib.md",
    "docs/gaps-closing.json",
    "docs/mcp_metadata_storage_design.md",
    "docs/mcp_metadata_storage_implementation.rs",
    "docs/mcp_metadata_storage_summary.md",
    "docs/perpetual_persona_swarms.md",
    "docs/session-message-management-design.md",
    "docs/subtask_*.md",
    "docs/tool_registration_design.md",
    "docs/tui_framework_brief.md",
    "docs/tui_technical_specs.json",
    "docs/agent-swarm-integration-*.md",
    "docs/agent-swarm-integration-*.rs",
    "docs/PROJECT_CONSTRAINTS_ANALYSIS.md",
    "docs/RISK_ASSESSMENT_AND_MITIGATION.md",
    "docs/TECHNICAL_REQUIREMENTS_SUMMARY.md",
    ".codetether-todos.json",
]

[lib]
name = "codetether_agent"
path = "src/lib.rs"

[[bin]]
name = "codetether"
path = "src/main.rs"

[features]
default = ["tetherscript"]
tetherscript = ["dep:codetether-tetherscript-computer", "dep:codetether-tetherscript-tool", "dep:tetherscript", "codetether-browser/tetherscript", "dep:codetether-tetherscript-values", "dep:codetether-provider-tetherscript", "codetether-provider-bonsai/tetherscript"]
# Local in-process inference via Candle. Off by default: the agent leads with
# remote/HTTP providers unless a local model backend is explicitly requested.
candle = [
    "codetether-cognition-native/candle",
    "codetether-provider-bonsai/candle",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
candle-cuda = ["codetether-provider-local-cuda/candle-cuda", "codetether-cognition-native/candle-cuda", "candle", "codetether-provider-bonsai/candle-cuda", "candle-core/cuda", "candle-transformers/cuda"]
candle-cudnn = ["codetether-cognition-native/candle-cudnn", "candle-cuda", "candle-core/cudnn", "candle-transformers/cudnn"]
candle-accelerate = ["codetether-cognition-native/candle-accelerate", "candle", "candle-core/accelerate", "candle-transformers/accelerate"]
candle-mkl = ["codetether-cognition-native/candle-mkl", "candle", "candle-core/mkl", "candle-transformers/mkl"]
functiongemma = ["codetether-cognition-native/functiongemma", "candle"]
# Opt-in QUIC worker transport (server listener + worker dial path). The QUIC
# primitive stack always compiles; this gates the live wiring.
quic-transport = []
# FIPS 140-3 build: link the NIST-validated AWS-LC FIPS module (aws-lc-fips-sys)
# instead of stock AWS-LC, and refuse to start unless FIPS mode is active.
# Requires CMake, Go, and a C compiler at build time.
fips = [
    "codetether-tls/fips",
    "codetether-a2a-stream/fips",
    "rustls/fips",
    "aws-lc-rs/fips",
    "quinn/rustls-aws-lc-rs-fips",
]

