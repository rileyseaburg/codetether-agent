[workspace]
members = [
    ".",
    "crates/codetether-a2a-worker-core",
    "crates/codetether-browser",
    "crates/codetether-rlm",
]

[package]
name = "codetether-agent"
version = "4.7.5-dev.49"


edition = "2024"
authors = ["Riley Seaburg <riley@rileyseaburg.com>"]
description = "A2A-native AI coding agent for the CodeTether ecosystem"
license = "MIT"
repository = "https://github.com/rileyseaburg/codetether-agent"
exclude = [
    "npm/",
    "dist/",
    "target/",
    "vendor/",
    "doc/",
    "codetether-bin",
    "docs/tui-screenshot.png",
    "prd*.json",
    "ui-prd.json",
    "worktree-prd.json",
    "feature_*.json",
    "benchmark_results.json",
    "subtask*.json",
    "subtask*.md",
    "*.txt",
    "*.py",
    "post.md",
    "gap-inventory.md",
    "content_inventory_document.md",
    "static_analysis_report.md",
    "provider_fields_analysis.md",
    "research_interactive_file_editing_cli_tools.md",
    "test_confirmation.md",
    "test_history_navigation.md",
    "test_theme.toml",
    "DOCUMENTATION_UPDATE_SUMMARY.md",
    "IMPLEMENTATION_ANALYSIS.md",
    "TECHNOLOGY_ASSESSMENT.md",
    "TUI_MODULE_DOCUMENTATION.md",
    "RALPH_DOCUMENTATION.md",
    "docs/assessment_config_main_lib.md",
    "docs/gaps-closing.json",
    "docs/mcp_metadata_storage_design.md",
    "docs/mcp_metadata_storage_implementation.rs",
    "docs/mcp_metadata_storage_summary.md",
    "docs/perpetual_persona_swarms.md",
    "docs/session-message-management-design.md",
    "docs/subtask_*.md",
    "docs/tool_registration_design.md",
    "docs/tui_framework_brief.md",
    "docs/tui_technical_specs.json",
    "docs/agent-swarm-integration-*.md",
    "docs/agent-swarm-integration-*.rs",
    "docs/PROJECT_CONSTRAINTS_ANALYSIS.md",
    "docs/RISK_ASSESSMENT_AND_MITIGATION.md",
    "docs/TECHNICAL_REQUIREMENTS_SUMMARY.md",
    ".codetether-todos.json",
]

[lib]
name = "codetether_agent"
path = "src/lib.rs"

[[bin]]
name = "codetether"
path = "src/main.rs"

[features]
default = ["tetherscript"]
tetherscript = ["dep:tetherscript", "codetether-browser/tetherscript"]
# Local in-process inference via Candle. Off by default: the agent leads with
# remote/HTTP providers unless a local model backend is explicitly requested.
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
candle-cuda = ["candle", "candle-core/cuda", "candle-transformers/cuda"]
candle-cudnn = ["candle-cuda", "candle-core/cudnn", "candle-transformers/cudnn"]
candle-accelerate = ["candle", "candle-core/accelerate", "candle-transformers/accelerate"]
candle-mkl = ["candle", "candle-core/mkl", "candle-transformers/mkl"]
functiongemma = ["candle"]
# Opt-in QUIC worker transport (server listener + worker dial path). The QUIC
# primitive stack always compiles; this gates the live wiring.
quic-transport = []

[dependencies]
# Workspace crates
codetether-a2a-worker-core = { path = "crates/codetether-a2a-worker-core", version = "0.1.0" }
codetether-browser = { path = "crates/codetether-browser", version = "0.1.1" }
codetether-rlm = { path = "crates/codetether-rlm", version = "0.1.1" }

# Async runtime
# Keep this on async-std's major version so the S3 executor cap configures the
# same global pool used by MinIO instead of starting a second, unused pool.
async-global-executor = "2.4.1"
unicode-width = "0.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# Clipboard support
arboard = "3.4"

# CLI
clap = { version = "4.6.6", features = ["derive", "env"] }

# HTTP server/client
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1.12.1"
reqwest = { version = "0.13.2", features = ["json", "stream", "rustls", "multipart", "form", "blocking"], default-features = false }
http = "1.5.0"
minio = "0.4.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["cors", "trace", "auth"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# AI providers
async-openai = { version = "0.41.3", features = ["chat-completion"] }

# A2A/MCP protocols
jsonrpc-core = "18"

# gRPC transport (A2A protocol)
tonic = "0.14.3"
tonic-prost = "0.14.3"
tonic-web = "0.14"
prost = "0.14.3"
prost-types = "0.14.3"
async-stream = "0.3"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

# TUI
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color", "macros"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }

# Config
config = "0.15"
directories = "6"
toml = "1.1.4+spec-1.1.0"
dotenvy = "0.15"

# Secrets (HashiCorp Vault)
vaultrs = "0.8.0"

# Kubernetes self-deployment
kube = { version = "4.2.0", features = ["runtime", "client", "derive", "config"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }

# Plugin signing & sandboxing
# See docs/tetherscript_dependency.md for the build requirement.
tetherscript = { version = "0.1.0-alpha.30", features = ["tera"], optional = true }
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4"

# Image encoding
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

# JWT token minting
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

# Voice input (microphone capture + WAV encoding)
cpal = "0.18.1"
hound = "3.5"

# Utilities
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1"
urlencoding = "2"
rand = "0.10.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.34"
async-trait = "0.1.92"
lazy_static = "1.4"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "6"
glob = "0.3.4"
html-escape = "0.2.15"
ignore = "0.4.33"
walkdir = "2"
which = "8.0.5"
regex = "1.13.1"
memchr = "2.8.3"
memmap2 = "0.9"
similar = "3.1.2"
lsp-types = "0.97.0"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
open = "5.4.1"
tempfile = "3.25.0"
candle-core = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.1", optional = true }
hf-hub = { version = "1.0.0", default-features = false, features = ["socks", "blocking", "rustls-tls"] }
sysinfo = "0.39.6"

# Ropey rope buffer powers the TUI editor backend. This is the same rope type
# Helix re-exports as `helix_core::Rope`, but depending on it directly avoids
# pulling helix-core's vendored tree-sitter (`tree-house-bindings`), which
# collides at link time with our standalone `tree-sitter` C symbols.
ropey = "1.6"
streaming-iterator = "0.1.9"
mdns-sd = "0.20.3"
gethostname = "1"
if-addrs = "0.15.0"
socket2 = "0.6.5"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
async-std = "1.13.2"
tokio-test = "0.4"
tempfile = "3"
insta = "1"
rcgen = "0.14.9"

[build-dependencies]
tonic-prost-build = "0.14.3"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep symbol names so alloc-guard / panic-hook crash backtraces resolve.
# `strip = true` yields all-`<unknown>` frames, defeating pre-OOM reports.
strip = "debuginfo"

# CI profile: sccache-friendly (no LTO, parallel codegen)
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[patch.crates-io]
candle-kernels = { path = "vendor/candle-kernels" }
tetherscript = { path = "vendor/tetherscript" }
