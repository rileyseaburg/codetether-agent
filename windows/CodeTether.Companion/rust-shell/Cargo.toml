[package]
name = "codetether-companion-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Windows controls for the CodeTether screen companion"
license = "MIT"

[[bin]]
name = "codetether-companion"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
anyhow = "1"
bytes = "1.12.1"
base64 = "0.23.1"
chrono = "0.4"
codetether-companion-desktop = { path = "../desktop-staging" }
codetether-companion-protocol = { path = "../../../crates/codetether-companion-protocol" }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"