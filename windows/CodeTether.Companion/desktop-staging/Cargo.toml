[package]
name = "codetether-companion-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed Windows desktop checks and memory-only selected-monitor capture"
license = "MIT"

[target.'cfg(windows)'.dependencies]
jpeg-encoder = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dependencies]
zeroize = "1"