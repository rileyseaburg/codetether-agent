name: Publish Forgejo release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: codetether-release-proxmox
    # Upload goes over the LAN: 192.168.50.80:3000 is the Forgejo container on
    # VM 200 of the proxmox host (192.168.50.133). Uploading ~140 MB of assets
    # through the Cloudflare tunnel stalled with zero output and hit the job
    # deadline (runs 11515/11516 on v4.7.6-dev.33); the same upload from the
    # runner takes ~1 ms per API round-trip over the LAN, and the job token
    # authenticates against the LAN address.
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          path: source
      - id: notes
        name: Per-platform install notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'body<<CODETETHER_NOTES_EOF'
            bash source/script/forgejo/release-notes.sh "$RELEASE_VERSION"
            echo 'CODETETHER_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          path: incoming
      - name: Require all platforms and checksum artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -mindepth 2 -maxdepth 2 -type f -path 'incoming/release-*/*' -exec cp '{}' dist/ \;
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "dist/codetether-v$RELEASE_VERSION-$target.tar.gz"
          done
          test -s "dist/codetether-v$RELEASE_VERSION-x86_64-pc-windows-gnu.exe"
          test -s "dist/codetether-v$RELEASE_VERSION-x86_64-pc-windows-gnu.zip"
          test -s "dist/codetether-v$RELEASE_VERSION-x86_64-pc-windows-gnu.msi"
          cd dist
          sha256sum * > "SHA256SUMS-v$RELEASE_VERSION.txt"
      # Publish via the Forgejo API directly instead of forgejo-release@de47e39:
      # that action's tea 0.9.0 writes all upload output to a temp file
      # and the upload stalled for the full 60min deadline in runs
      # 11515/11516/11517 (even after switching to the LAN URL). curl + API is
      # the same path proven live (91MB -> HTTP 201 in <1s), and every step now
      # logs progress, so a repeat of the silent stall cannot hide.
      - name: Publish release assets via API
        shell: bash
        env:
          RELEASE_URL: http://192.168.50.80:3000
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
          NOTES_FILE: release-notes.md
          DIST_DIR: dist
        run: |
          set -euo pipefail
          printf '%s' "$NOTES_BODY" > release-notes.md
          bash source/script/forgejo/publish-release-assets.sh