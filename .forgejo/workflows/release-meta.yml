name: Read release version
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.meta.outputs.version }}
jobs:
  meta:
    # Reading Cargo.toml must not block every platform behind the macOS queue.
    runs-on: codetether-release-proxmox
    # Cold LXC preparation consumed 9m44s of a 10-minute budget in run #101.
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"