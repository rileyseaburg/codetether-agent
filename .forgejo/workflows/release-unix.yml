name: Build Unix release
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      # Whether the caller's runner has the ci-cache CLI baked in. macOS jobs
      # pass "false" so a cache-less runner degrades instead of failing.
      require-cache:
        required: false
        type: string
        default: "true"
      version:
        required: true
        type: string
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: cc
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - name: Prepare native dependencies
        run: bash script/forgejo/release-setup.sh "$RELEASE_TARGET"
      - name: Set up CI cache
        uses: ./.forgejo/actions/setup-ci-cache
        with:
          require: ${{ inputs.require-cache }}
      - name: Restore cargo caches
        run: |
          bash scripts/ci/cargo-cache.sh restore cargo-home "cargo-home-v1-${{ hashFiles('Cargo.lock') }}"
          bash scripts/ci/cargo-cache.sh restore target "cargo-target-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock') }}"
      - name: Build locked release binary
        run: cargo +1.95.0 build --locked --release --target "$RELEASE_TARGET"
      - name: Save cargo caches
        if: always()
        run: |
          bash scripts/ci/cargo-cache.sh save cargo-home "cargo-home-v1-${{ hashFiles('Cargo.lock') }}"
          bash scripts/ci/cargo-cache.sh save target "cargo-target-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock') }}"
      - name: Smoke test native binaries
        shell: bash
        run: |
          # Only execute binaries matching this runner's native architecture.
          if [ "$RELEASE_TARGET" = "$(rustc +1.95.0 -vV | sed -n 's/^host: //p')" ]; then
            "target/$RELEASE_TARGET/release/codetether" --version
          fi
      - name: Package unsigned artifacts
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/$RELEASE_TARGET/release" -czf "dist/codetether-v$RELEASE_VERSION-$RELEASE_TARGET.tar.gz" codetether
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: release-${{ inputs.target }}
          path: dist/*
          if-no-files-found: error