name: Release
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Build assets only; retain the separately prepared draft release
        type: boolean
        required: false
        default: false
  push:
    branches: ['release/forgejo-*']
permissions:
  contents: write
concurrency:
  group: forgejo-release
  cancel-in-progress: false
jobs:
  meta:
    uses: ./.forgejo/workflows/release-meta.yml
  linux:
    # Check the Windows cross-build before spending another Linux build.
    needs: [meta, verify, windows]
    uses: ./.forgejo/workflows/release-unix.yml
    with:
      runner: codetether-release-proxmox
      target: x86_64-unknown-linux-gnu
      version: ${{ needs.meta.outputs.version }}
  windows:
    needs: [meta, verify]
    uses: ./.forgejo/workflows/release-windows.yml
    with:
      version: ${{ needs.meta.outputs.version }}
  macos:
    needs: [meta, verify]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    uses: ./.forgejo/workflows/release-unix.yml
    with:
      runner: macOS
      target: ${{ matrix.target }}
      version: ${{ needs.meta.outputs.version }}
  verify:
    # Reject invalid candidates before repeating expensive platform builds.
    # Nested job memory limits must accommodate the compiler and test harness.
    needs: meta
    uses: ./.forgejo/workflows/release-verify.yml
  publish:
    if: ${{ github.event.inputs.draft != 'true' && github.event.inputs.draft != true }}
    needs: [meta, verify, linux, windows, macos]
    uses: ./.forgejo/workflows/release-publish.yml
    with:
      version: ${{ needs.meta.outputs.version }}