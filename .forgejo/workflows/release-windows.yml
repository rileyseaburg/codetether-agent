name: Build Windows release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  build:
    runs-on: codetether-release-proxmox
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - name: Prepare writable Docker and Buildx directories
        run: bash scripts/forgejo/prepare-windows-buildx.sh
      - uses: https://github.com/docker/setup-buildx-action@v3
        with:
          driver: docker
          endpoint: unix:///var/run/docker.sock
      - name: Cross-build Windows GNU artifact
        shell: bash
        run: bash scripts/forgejo/build-windows-artifact.sh
      - name: Package Windows executable and ZIP
        run: bash scripts/forgejo/package-windows-release.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: release-x86_64-pc-windows-gnu
          path: dist/codetether-v*
          if-no-files-found: error