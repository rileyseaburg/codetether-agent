name: Build Windows release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  build:
    runs-on: codetether-release-proxmox
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - name: Prepare writable Docker and Buildx directories
        run: bash script/forgejo/prepare-windows-buildx.sh
      - uses: https://github.com/docker/setup-buildx-action@v3
        with:
          endpoint: unix:///var/run/docker.sock
      - name: Cross-build Windows GNU artifact
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker info
          grep -Eq 'cargo build .*--locked' docker/release/windows.Dockerfile
          docker buildx build --platform linux/amd64 \
            --file docker/release/windows.Dockerfile --target artifact \
            --output type=local,dest=build/windows .
      - name: Package Windows executable and ZIP
        run: bash script/forgejo/package-windows-release.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: release-x86_64-pc-windows-gnu
          path: dist/codetether-v*
          if-no-files-found: error