name: Build Windows release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  build:
    runs-on: spotlessbinco-k8s-dind-privileged
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DOCKER_HOST: tcp://127.0.0.1:2375
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - uses: https://github.com/docker/setup-buildx-action@v3
      - name: Cross-build Windows GNU artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'cargo build .*--locked' docker/release/windows.Dockerfile
          docker buildx build --platform linux/amd64 \
            --file docker/release/windows.Dockerfile --target artifact \
            --output type=local,dest=build/windows .
      - name: Package Windows executable and ZIP
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1 || ! command -v wixl >/dev/null 2>&1; then
            elevate=(); if [ "$(id -u)" -ne 0 ]; then elevate=(sudo); fi
            "${elevate[@]}" sh script/forgejo/apt-https.sh
            "${elevate[@]}" apt-get update
            "${elevate[@]}" apt-get install -y --no-install-recommends python3 wixl msitools
          fi
          asset="codetether-v$RELEASE_VERSION-x86_64-pc-windows-gnu"
          mkdir -p dist
          test -s build/windows/codetether.exe
          cp build/windows/codetether.exe "dist/$asset.exe"
          python3 script/package-windows-bundle.py --binary "dist/$asset.exe" \
            --archive "dist/$asset.zip" --staging build/windows-bundle
          cp "dist/$asset.exe" dist/codetether.exe
          python3 script/build-windows-msi.py
          cp dist/codetether-windows.msi "dist/$asset.msi"
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-x86_64-pc-windows-gnu
          path: dist/codetether-v*
          if-no-files-found: error