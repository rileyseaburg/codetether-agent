name: Native Bonsai CUDA validation
on:
  workflow_dispatch:
  push:
    branches: ['ci/bonsai-native']
concurrency:
  group: bonsai-native-cuda75
  cancel-in-progress: true
jobs:
  build:
    runs-on: spotlessbinco-k8s-dind-privileged
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
      options: --cpus=2 --memory=10g --memory-swap=10g
    steps:
      - name: Bootstrap verified Node for action execution
        run: |
          set -e
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|http://|https://|g' {} +
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://nodejs.org/dist/v20.19.5/node-v20.19.5-linux-x64.tar.gz -o /tmp/node.tgz
          echo '4eba5fbe1fb10753bc06e42f001a91c5cec16798b7764a3e9257adc59af47fe1  /tmp/node.tgz' | sha256sum -c -
          tar -xzf /tmp/node.tgz -C /usr/local --strip-components=1
      - uses: https://github.com/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - name: Prepare remote CUDA build environment
        run: bash script/forgejo/bonsai-setup.sh
      - name: Compile and exercise native CPU reference tests
        run: bash script/forgejo/bonsai-build.sh
      - name: Preserve compiler and test evidence
        if: always()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: bonsai-native-evidence
          path: bonsai-evidence/*
          if-no-files-found: warn
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: bonsai-native-cuda75
          path: bonsai-dist/*
          if-no-files-found: error