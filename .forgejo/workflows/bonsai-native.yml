name: Native Bonsai CUDA validation
on:
  workflow_dispatch:
  push:
    branches: ['ci/bonsai-native']
concurrency:
  group: bonsai-native-cuda75
  cancel-in-progress: true
jobs:
  build:
    runs-on: spotlessbinco-k8s-dind-privileged
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
      options: --cpus=2 --memory=10g --memory-swap=10g
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_TARGET_DIR: /tmp/bonsai-target
      CUDA_COMPUTE_CAP: '75'
      CARGO_PROFILE_CI_DEBUG: '0'
      CARGO_PROFILE_CI_CODEGEN_UNITS: '256'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          github-server-url: https://forgejo.quantum-forge.io
      - name: Prepare remote CUDA build environment
        run: bash script/forgejo/bonsai-setup.sh
      - name: Compile and exercise native CPU reference tests
        run: bash script/forgejo/bonsai-build.sh
      - name: Preserve compiler and test evidence
        if: always()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: bonsai-native-evidence
          path: bonsai-evidence/*
          if-no-files-found: warn
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: bonsai-native-cuda75
          path: bonsai-dist/*
          if-no-files-found: error