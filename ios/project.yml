name: CodeTether
include: [tests.yml, ui-tests.yml]
options:
  bundleIdPrefix: run.codetether
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: J9YRM3U37D
    CODE_SIGN_STYLE: Automatic
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  CodeTether:
    type: application
    platform: iOS
    dependencies:
      - package: MarkdownUI
    sources:
      - path: Sources
      - path: Resources/SileroVAD.mlmodelc
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.codetether.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CodeTether
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to attach to a CodeTether message.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate messages to your CodeTether agent.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe your voice into a message you can review before sending.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.5.1'
        CURRENT_PROJECT_VERSION: '22'